<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MihirakiPDFUtility</title>
  <desc id="desc">深いティールの背景に、見開きの白いページとコーラル色の双方向矢印。</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="75%">
      <stop stop-color="#07888b"/>
      <stop offset="1" stop-color="#007074"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#edf2f4"/>
      <stop offset=".2" stop-color="#fff"/>
      <stop offset=".85" stop-color="#fff"/>
      <stop offset="1" stop-color="#f3f5f6"/>
    </linearGradient>
